name: Build Anegram APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Set API keys
        run: |
          sed -i 's/APP_ID = 4/APP_ID = 2040/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/APP_HASH = "ae2c1d609867d2e5642ebfc8fb9a5e61"/APP_HASH = "b18441a1ff607e10a989891a5462e627"/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Anegram-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
