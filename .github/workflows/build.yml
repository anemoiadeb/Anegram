name: Build Anegram APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Fix gradle JVM args
        run: |
          find . -name "gradle.properties" | xargs -I{} sed -i 's/-XX:MaxPermSize=[^ ]*//g' {}

      - name: Set API keys
        run: |
          python3 << 'PYEOF'
          import re
          path = 'TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'APP_ID = \d+', 'APP_ID = 36028663', content)
          content = re.sub(r'APP_HASH = "[^"]*"', 'APP_HASH = "fc1ec74196461cb76d73aae901a9241c"', content)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anegram-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
